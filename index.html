<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="overlay">
      <div class="panel">
        <h1>MINECRAFT</h1>
        <p>Click to play</p>
        <ul class="help">
          <li><b>WASD</b> move</li>
          <li><b>Space</b> jump</li>
          <li><b>Shift</b> sprint</li>
          <li><b>Mouse</b> look</li>
          <li><b>Left click</b> break block</li>
          <li><b>Right click</b> place block</li>
          <li><b>1-7</b> select block</li>
          <li><b>F</b> fly on/off (double space to ascend)</li>
          <li><b>Esc</b> release mouse</li>
        </ul>
      </div>
    </div>
    <div id="crosshair">+</div>
    <div id="hotbar"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
